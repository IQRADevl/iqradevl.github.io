name: Auto Sync VervalPD Cookie via TOTP

on:
  schedule:
    # Jalankan otomatis setiap hari jam 01:00 UTC (jam 08:00 WIB)
    - cron: '0 1 * * *'
  workflow_dispatch: # Supaya bisa di-trigger manual dari tab Actions

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyotp requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run Cookie Sync
        env:
          SSO_USERNAME: ${{ secrets.SSO_USERNAME }}
          SSO_PASSWORD: ${{ secrets.SSO_PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET_PASS: ${{ secrets.WORKER_SECRET_PASS }}
        run: python sync_cookie.py